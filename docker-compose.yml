# Local stack: app + Postgres + Valkey + LocalStack (S3/SNS/SQS) + ElasticMQ + Keycloak + workers.
# The single stack every later phase runs against. `make compose-up`.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      VALKEY_URL: redis://valkey:6379/0
      S3_ENDPOINT_URL: http://localstack:4566
      S3_PRESIGN_PUBLIC_BASE_URL: http://localhost:4566
      S3_BUCKET: ecommerce-uploads
      S3_PUBLIC_BASE_URL: http://localhost:4566/ecommerce-uploads
      IMAGE_QUEUE_URL: http://localstack:4566/000000000000/image-uploads
      CATALOG_CACHE_QUEUE_URL: http://localstack:4566/000000000000/catalog-cache
      SQS_ENDPOINT_URL: http://elasticmq:9324
      SQS_QUEUE_URL: http://elasticmq:9324/queue/emails
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # Keycloak pins one canonical issuer (KC_HOSTNAME below), so tokens carry the
      # same `iss` whether they were minted via localhost:8080 (host/browser) or
      # keycloak:8080 (compose network). JWKS and the Admin API use the internal
      # hostname since the canonical issuer host is not container-reachable.
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ecommerce
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/ecommerce/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_ADMIN_CLIENT_ID: ecommerce-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: change-me-local-only
      CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
      PAYMENT_STUB_FAIL_TOKEN_SUBSTRING: decline
      PAYMENT_WEBHOOK_SECRET: dev-webhook-secret-change-me
      PAYMENT_RECONCILIATION_GRACE_SECONDS: "30"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-shot: run every module's Alembic chain to head once Postgres is ready,
  # before app/relay start serving. PYTHONPATH=/app so alembic env.py can import `src`.
  migrate:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      PYTHONPATH: /app
    command:
      - sh
      - -c
      - "for m in identity catalog inventory orders payments; do alembic -c src/$$m/alembic.ini upgrade head; done"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
      - "9325:9325"

  # SNS + SQS for the transactional-outbox event bus. ElasticMQ above
  # is SQS-only; the bus needs SNS fan-out, so it runs on LocalStack.
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sns,sqs,s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # One-shot: create SNS topics (one per event type) + consumer queues/DLQs/subs.
  bus-setup:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
    command: ["python", "-m", "scripts.bus_bootstrap"]

  # One-shot: create the uploads bucket + image-uploads queue/DLQ + the
  # S3 ObjectCreated→SQS notification (uploads/ prefix), then exit.
  # CORS_ALLOW_ORIGINS: the SPA origin, so the browser can POST presigned
  # uploads to the bucket cross-origin (bucket CORS applied by the bootstrap).
  s3-setup:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: ecommerce-uploads
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    command: ["python", "-m", "scripts.s3_bootstrap"]

  # One-shot (explicitly invoked): seed the demo state — 4 Keycloak users, 11 products
  # (5 + 6 across two merchants), 11 images through the real pipeline, stock
  # per product. Explicitly invoked via `make seed` / `make seed-reset`;
  # profile-gated so a normal `compose up` never runs it (the repo is shared
  # by other UI projects). Not the FastAPI lifespan: that runs in prod ECS.
  # Seeding is on by default (SEED_DEMO_DATA=1 is the shipped default); set
  # SEED_DEMO_DATA=0 to make the script a hard refusal — also enforced inside
  # the script, so `python -m scripts.catalog_seed` on a host with the kill
  # switch set is still a hard refusal.
  catalog-seed:
    build: .
    profiles: ["seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      keycloak:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      s3-setup:
        condition: service_completed_successfully
      bus-setup:
        condition: service_completed_successfully
      relay:
        condition: service_started
      image-worker:
        condition: service_started
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: ecommerce-uploads
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      KEYCLOAK_ISSUER: http://localhost:8080/realms/ecommerce
      KEYCLOAK_SERVER_URL: http://keycloak:8080/
      KEYCLOAK_ADMIN_CLIENT_ID: ecommerce-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: change-me-local-only
      SEED_DEMO_DATA: "1"
    command: ["python", "-m", "scripts.catalog_seed"]

  # The `service`-role outbox relay: polls unpublished outbox rows → SNS.
  relay:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bus-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      VALKEY_URL: redis://valkey:6379/0
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WORKER_METRICS_PORT: "9100"
    ports:
      - "9101:9100"
    command: ["python", "-m", "src.shared.bus.relay"]

  # The `service`-role image worker: drains S3 ObjectCreated events → sniff +
  # re-encode + thumbnails → marks the product image usable.
  image-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      s3-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      VALKEY_URL: redis://valkey:6379/0
      S3_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: ecommerce-uploads
      IMAGE_QUEUE_URL: http://localstack:4566/000000000000/image-uploads
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WORKER_METRICS_PORT: "9100"
    ports:
      - "9102:9100"
    command: ["python", "-m", "src.catalog.adapters.image_worker"]

  # The `service`-role catalog cache worker: drains ProductUpdated/ProductDeleted
  # from the catalog-cache queue → evicts the product from the Valkey read-cache.
  cache-worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      bus-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      VALKEY_URL: redis://valkey:6379/0
      CATALOG_CACHE_QUEUE_URL: http://localstack:4566/000000000000/catalog-cache
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WORKER_METRICS_PORT: "9100"
    ports:
      - "9103:9100"
    command: ["python", "-m", "src.catalog.adapters.cache_worker"]

  # The `service`-role cart worker: drains ProductUpdated/ProductDeleted
  # from the cart-events queue → refreshes/prunes Valkey cart snapshots.
  # Pure Valkey (no Postgres): no migrate dependency.
  cart-consumer:
    build: .
    depends_on:
      valkey:
        condition: service_healthy
      localstack:
        condition: service_healthy
      bus-setup:
        condition: service_completed_successfully
    environment:
      # AppSettings fail-fast requires DATABASE_URL even though this worker never
      # touches Postgres (pure Valkey) — without it the process dies at boot.
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      VALKEY_URL: redis://valkey:6379/0
      CART_QUEUE_URL: http://localstack:4566/000000000000/cart-events
      BUS_ENDPOINT_URL: http://localstack:4566
      BUS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WORKER_METRICS_PORT: "9100"
    ports:
      - "9106:9100"
    command: ["python", "-m", "src.cart.adapters.cart_consumer"]

  # The `service`-role reservation reaper: releases stock holds whose TTL expired
  # (a stalled checkout saga must not leak stock into a phantom oversell-block).
  # Cron-style loop locally; an EventBridge-scheduled `--once` ECS task in prod.
  reaper:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      VALKEY_URL: redis://valkey:6379/0
      RESERVATION_TTL_SECONDS: "900"
      RESERVATION_REAPER_POLL_INTERVAL_SECONDS: "10.0"
      WORKER_METRICS_PORT: "9100"
    ports:
      - "9104:9100"
    command: ["python", "-m", "src.inventory.adapters.reaper"]

  # The `service`-role payment reconciler: resolves charges still `pending` past
  # their grace window by asking the gateway directly (a missed webhook must not
  # strand the order). Same guarded transitions as the webhook, so races are safe.
  payment-reconciler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      PAYMENT_STUB_FAIL_TOKEN_SUBSTRING: decline
      PAYMENT_RECONCILIATION_GRACE_SECONDS: "30"
      PAYMENT_RECONCILIATION_POLL_INTERVAL_SECONDS: "60"
      PAYMENT_RECONCILIATION_BATCH_SIZE: "50"
      PAYMENT_RECONCILIATION_MAX_AGE_SECONDS: "604800"
      WORKER_METRICS_PORT: "9100"
    ports:
      - "9105:9100"
    command: ["python", "-m", "src.payments.adapters.reconciler"]

  # The `service`-role saga recovery poller: settles checkout orders still
  # `pending` past the step timeout (a crashed saga must not leave stock held
  # and an order undecided). Cron-style loop locally; an EventBridge-scheduled
  # `--once` ECS task in prod. Mirrors the reaper; needs Valkey to clear carts.
  saga-recovery:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://ecommerce:ecommerce@postgres:5432/ecommerce
      VALKEY_URL: redis://valkey:6379/0
      RESERVATION_TTL_SECONDS: "900"
      CHECKOUT_SAGA_STEP_TIMEOUT_SECONDS: "60"
      CHECKOUT_SAGA_RECOVERY_POLL_INTERVAL_SECONDS: "10.0"
      WORKER_METRICS_PORT: "9100"
    ports:
      - "9107:9100"
    command: ["python", "-m", "src.shared.saga_recovery"]

  # Optional monitoring profile: scrapes the API's /metrics (RED per endpoint,
  # checkout counters, outbox lag) and every worker's WORKER_METRICS_PORT.
  # Start with: docker compose --profile monitoring up -d prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/inventory-reaper-alerts.yaml:/etc/prometheus/inventory-reaper-alerts.yaml:ro
      - ./ops/prometheus/postgres-exporter-queries.yaml:/etc/prometheus/postgres-exporter-queries.yaml:ro

  # Same profile, second half: the DB-side exporter whose queries (expired-hold
  # backlog) keep answering when a worker is dead — the reaper's liveness alert.
  # Needs PROMETHEUS extension + the query file; add DATA_SOURCE_NAME when using.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://ecommerce:ecommerce@postgres:5432/ecommerce?sslmode=disable
      EXTEND_QUERY_PATH: /etc/postgres-exporter/queries.yaml
    ports:
      - "9187:9187"
    volumes:
      - ./ops/prometheus/postgres-exporter-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Local mail catcher: Keycloak's "update account" email (admin user creation)
  # needs an SMTP server or the create rolls back. UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # IdP: imports the ecommerce realm (consumer/merchant/admin/service roles + clients) on boot.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One canonical issuer for every caller. Without this, a token fetched over
      # the compose network gets iss=http://keycloak:8080/... while a host/browser
      # token gets localhost, and one of the two always fails the issuer check.
      # Backchannel stays static (not *_DYNAMIC) so internal calls keep this issuer.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres-data:
