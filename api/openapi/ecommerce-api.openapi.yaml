openapi: 3.1.0
info:
  title: Scalable E-commerce Backend API
  version: 0.1.0
  description: >-
    Async, API-first FastAPI e-commerce backend. Hand-authored contract and
    design source of truth (Spectral-linted). Paths are filled in per phase.
  license:
    name: MIT
  contact:
    name: Scalable E-commerce Backend
    url: https://github.com/KRISHNATEJATATA/scalable-ecommerce-backend
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes
  - name: metrics
    description: Prometheus metrics exposition
  - name: identity
    description: OIDC resource-server identity — the local user mirror and Keycloak admin management
  - name: catalog
    description: Product catalog — merchant product CRUD and the shopper listing
  - name: cart
    description: Pre-checkout basket — per-caller Valkey state, no pagination
  - name: inventory
    description: Stock levels per SKU — the merchant/admin stock declaration
  - name: checkout
    description: The checkout saga — one cart driven to one terminal order
  - name: orders
    description: The caller's own order history, detail, and cancellation
paths:
  /v1/products:
    get:
      tags: [catalog]
      operationId: listProducts
      summary: List products (keyset-paginated, filterable)
      description: >-
        Keyset-paginated listing of live (non-deleted) products. `sort` is a
        whitelisted field (`created_at`/`price`/`name`) with an optional leading
        `-` for descending; `category`/`merchant_id` filter the result and
        `search` substring-matches it.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: { type: string, default: "-created_at" }
        - name: cursor
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: merchant_id
          in: query
          schema: { type: string, format: uuid }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
          description: >-
            Case-insensitive substring match over `name` and `description`;
            the characters `%`, `_` and `\` match literally. Composes (AND)
            with the other filters; result order stays the keyset `sort`
            order — no relevance ranking (ADR 0017).
      responses:
        "200":
          description: One keyset page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          description: Unknown sort/filter field or an undecodable cursor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [catalog]
      operationId: createProduct
      summary: Create a product (merchant only)
      description: >-
        Creates a product owned by the authenticated merchant. `merchant_id` is
        never accepted from input — it is bound from the caller. Emits
        `ProductCreated` via the transactional outbox.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: The created product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: Invalid request body (e.g. non-positive price).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/products/{product_id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [catalog]
      operationId: getProduct
      summary: Get one product
      description: >-
        Returns one live (non-deleted) product by id, or 404. The response
        carries `ETag: "<version>"` — send it back as `If-Match` to make a
        subsequent write conditional.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The product.
          headers:
            ETag:
              schema: { type: string }
              description: The product's quoted `version` (e.g. `"7"`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [catalog]
      operationId: updateProduct
      summary: Update a product (owner merchant only)
      description: >-
        Partial update of an owned product. A merchant mutating another
        merchant's product → 403 (admin bypasses ownership). Emits
        `ProductUpdated` via the outbox. Honours an optional `If-Match`
        precondition: a stale version answers `412` before any
        state changes — re-read and re-apply.
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: >-
            The quoted `version` from a previous read of this product (or `*`
            for "must exist"). Optional — without it the write proceeds and
            the server-side optimistic lock still answers 409 on a lost race.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: The updated product.
          headers:
            ETag:
              schema: { type: string }
              description: The post-write quoted `version`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: >-
            Malformed `If-Match` — not a quoted integer version and not `*`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Lost update — another writer advanced this product's version
            between the read and the write (optimistic lock). Re-read and
            re-apply.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: >-
            The `If-Match` version does not match the product's current
            `version` — the caller's copy is stale. Nothing was written;
            re-read and re-apply.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            Invalid patch — an empty body, an explicit `null` for `name`/`price`
            (both back NOT-NULL columns: omit to leave untouched), or a
            non-positive price.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [catalog]
      operationId: deleteProduct
      summary: Soft-delete a product (owner merchant only)
      description: >-
        Soft-deletes an owned product (cross-merchant → 403, admin bypasses).
        Emits `ProductDeleted` via the outbox. Honours an optional `If-Match`
        precondition like the update — a stale version answers `412` and
        nothing is deleted.
      security:
        - bearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
          description: The quoted `version` from a previous read (or `*`). Optional.
      responses:
        "204":
          description: Product soft-deleted.
        "400":
          description: >-
            Malformed `If-Match` — not a quoted integer version and not `*`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Lost update — a concurrent edit advanced this product's version
            (optimistic lock). Re-read and retry the delete.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "412":
          description: >-
            The `If-Match` version does not match the product's current
            `version` — nothing was deleted; re-read and retry.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/products/{product_id}/image:presign:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [catalog]
      operationId: presignProductImage
      summary: Presign an image upload (owner merchant only)
      description: >-
        Issues a short-TTL presigned S3 POST for an owned product image, but only
        AFTER validating ownership + content-type + declared size — the endpoint is
        never an open uploader. The upload lands under a private `uploads/` key; an
        S3-event worker then sniffs the real bytes, re-encodes (stripping EXIF),
        writes thumbnails, and marks the product image `ready` only if it passes
        (spoofed/oversized → `failed`). Cross-merchant → 403, missing → 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePresignRequest"
      responses:
        "200":
          description: The presigned-POST envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePresignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            Lost update — a concurrent edit advanced this product's version while
            the presign was marking its image `pending` (optimistic lock).
            Re-request the presign.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/checkout:
    post:
      tags: [checkout]
      operationId: checkout
      summary: Run the cart through the checkout saga
      description: >-
        Drives the caller's cart to a terminal order (reserve stock → charge
        → commit → `paid`). Requires an `Idempotency-Key` header: same key +
        same body replays the stored `201`; same key + different body →
        `409`; stock failure → `409` with the order already cancelled and
        compensation run (show "out of stock", not a retry loop); replaying
        an already-cancelled checkout re-raises its `409` — a retry needs a
        new key. Generate a new key whenever the cart changes — the key pins
        the first request it was sent with.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: Per-attempt client key that makes a retry safe to resend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: The checkout settled — the order (usually `paid`; `pending` only from crash recovery).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: >-
            The `payment_token` is a PAN-shaped value (card data) — rejected
            at the payments boundary, never forwarded to the gateway.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: >-
            Conflict — classify on the Problem `detail` (the `title` names the
            exception, e.g. "Idempotency Conflict"). **Terminal** — surface it,
            a retry cannot succeed: "insufficient stock for ..." (out of
            stock), "this Idempotency-Key was already used with a different
            request body" (same key, different body), "this checkout was
            already cancelled; start a new one with a new Idempotency-Key",
            "payment was declined; the order was cancelled", "checkout payment
            timed out; the order was cancelled", "the order was cancelled
            while checking out; start a new checkout", "cart is empty; nothing
            to check out", "checkout reservation timed out". **Settling —
            retry with the SAME key**: "payment outcome unknown; retry with
            the same Idempotency-Key to settle", "checkout commit timed out;
            it will be settled automatically", "checkout could not complete
            after payment; it will be settled automatically", "the order was
            cancelled while the payment was completing; it will be
            reconciled". Reservation conflicts/contention from the reserve
            step also surface as 409 (titles "Reservation Conflict" /
            "Reservation Contention").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Missing/empty/oversized `Idempotency-Key`, or an invalid body.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: List the caller's orders (keyset-paginated)
      description: >-
        Keyset-paginated history of the caller's own orders, newest first by
        default, optionally filtered by `status`. `sort` is a whitelisted
        field with an optional leading `-` for descending.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema: { type: string, default: "-created_at" }
        - name: cursor
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid, shipped, cancelled] }
      responses:
        "200":
          description: One keyset page of the caller's orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          description: Unknown sort field, unknown status, or an undecodable cursor.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get one of the caller's orders
      description: Returns one order with its frozen line items; another user's id → 403.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/orders/{order_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    post:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel the caller's own pending order
      description: >-
        Cancels a `pending` order and releases its stock holds. An
        already-`cancelled` order is idempotently returned. `paid`/`shipped`
        → `409` (refunds are the future reverse saga, not this endpoint); a
        settled-while-cancelling race → `409` telling the caller to re-read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The order in `cancelled` state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The order is not cancellable — `paid`/`shipped` ("only pending
            orders can be cancelled (order is ...)"), it settled while the
            cancel ran ("the order settled while cancelling; re-read it"), or
            its payment is still settling ("payment for this order is in
            progress; try again once it settles").
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Get the caller's cart
      description: >-
        Returns the caller's Valkey basket. An empty cart is `200
        {items: [], ...}`, never 404. Carts expire after inactivity and can be
        emptied by storage eviction — handle "suddenly empty" as normal.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [cart]
      operationId: clearCart
      summary: Clear the whole cart
      description: Empties the caller's cart.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Cart cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: Add a line to the cart (or increment it)
      description: >-
        Adds the line or increments the existing line; an increment past the
        per-line cap clamps to the cap. Quantity out of range or a full cart →
        400; unknown or soft-deleted product → 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartAddItem"
      responses:
        "200":
          description: The caller's cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Quantity out of range, or the cart holds the max lines.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/cart/items/{product_id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    patch:
      tags: [cart]
      operationId: setCartItemQuantity
      summary: Set a cart line's quantity
      description: >-
        Sets the line quantity; `0` removes the line. Out of range → 400; line
        not in cart, or its product gone (the stale line is pruned as part of
        answering), → 404.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartUpdateItem"
      responses:
        "200":
          description: The caller's cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: Quantity out of range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: Remove a cart line
      description: Removes the line. Idempotent — an absent line still answers 200.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's cart.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/me:
    get:
      tags: [identity]
      operationId: getMe
      summary: Get the authenticated caller
      description: >-
        Returns the caller's JIT-provisioned local `users` mirror. First
        authenticated request provisions the row; subsequent calls reuse it.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's local user mirror.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid, expired, or malformed bearer token.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The local account is disabled.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/admin/users:
    post:
      tags: [identity]
      operationId: createUser
      summary: Create a Keycloak user (admin only)
      description: >-
        Provisions a brand-new Keycloak account. Keycloak defaults new users to
        the `consumer` realm role — the app never accepts a role from input.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The new account's Keycloak `sub`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    get:
      tags: [identity]
      operationId: listAdminUsers
      summary: List the Keycloak directory (admin only)
      description: >-
        Cursor-paginated directory of Keycloak accounts as
        `{items, next_cursor}` pages of `{sub, email, merchant_role,
        disabled}`. `search` matches any part of username/email (substring,
        implemented as Keycloak's `*term*` infix — a `*` inside the term is
        still a Keycloak wildcard, ADR 0015). No `sort` param — Keycloak's
        users endpoint has none (documented deviation).
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
          description: Case-insensitive substring match over username/email.
      responses:
        "200":
          description: One page of the admin directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserPage"
        "400":
          description: Undecodable cursor or an unknown query param (no `sort` here).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/users/{sub}/roles/merchant:
    post:
      tags: [identity]
      operationId: grantMerchantRole
      summary: Grant the merchant realm role (admin only)
      description: >-
        Adds the Keycloak `merchant` realm role to the given user. Idempotent:
        granting a role the user already has still returns `204`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserSub"
      responses:
        "204":
          description: Role granted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [identity]
      operationId: revokeMerchantRole
      summary: Revoke the merchant realm role (admin only)
      description: >-
        Removes the Keycloak `merchant` realm role from the given user.
        Idempotent: revoking a role the user doesn't have still returns `204`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserSub"
      responses:
        "204":
          description: Role revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/inventory/{sku}:
    put:
      tags: [inventory]
      operationId: upsertStock
      summary: Declare a SKU's on-hand stock (merchant or admin)
      description: >-
        Creates the SKU's stock row or re-points its `on_hand`. Idempotent per
        value: re-PUT with the same `on_hand` lands the same state. Answers
        `409` when the row's currently-reserved units (live checkout holds)
        would exceed the new `on_hand` — reserved units may not be erased; raise
        `on_hand` or wait for the holds to release. No response event: consumers
        compose `available` (`on_hand - reserved`) fresh on every read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Sku"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockUpsertRequest"
      responses:
        "200":
          description: The stock row after the upsert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inventory"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The new `on_hand` is below the units currently reserved.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/admin/users/{sub}/disable:
    post:
      tags: [identity]
      operationId: disableUser
      summary: Disable a user (admin only)
      description: >-
        Disables the account in Keycloak and mirrors `is_active=false` locally
        (provisioning the local row first if the user never authenticated).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserSub"
      responses:
        "204":
          description: Account disabled.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/internal/whoami:
    get:
      tags: [identity]
      operationId: internalWhoami
      summary: Machine-to-machine identity check (service role only)
      description: >-
        Exercised by relay/worker clients authenticating with a Keycloak
        `service` machine-account token; confirms the role gate resolves
        end-to-end with no DB hit.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The caller's `sub` and role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub:
                    type: string
                  role:
                    type: string
                required: [sub, role]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 while the process is alive. Performs no dependency checks.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
  /v1/ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe
      description: >
        Pings Postgres, Valkey and (when a bus client is configured) SQS.
        200 with `{status, checks}` when every checked dependency is reachable;
        503 as an RFC 9457 Problem naming the unreachable ones in `details`.
      responses:
        "200":
          description: All checked dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: boolean
                required: [status, checks]
        "503":
          description: One or more critical dependencies are unreachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Prometheus metrics
      description: Prometheus text exposition of the default registry.
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued RS256 access token, validated against the realm's JWKS.
  parameters:
    UserSub:
      name: sub
      in: path
      required: true
      description: The target user's Keycloak OIDC `sub`.
      schema:
        type: string
    ProductId:
      name: product_id
      in: path
      required: true
      description: The product's UUID.
      schema:
        type: string
        format: uuid
    Sku:
      name: sku
      in: path
      required: true
      description: >-
        The SKU whose stock to declare. Checkout maps products to SKUs as the
        product UUID string (`str(product.id)`), so a product's stock row is
        keyed by its UUID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._:-]+$"
    OrderId:
      name: order_id
      in: path
      required: true
      description: The order's UUID.
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, invalid, expired, or malformed bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not permitted (missing role / not owner).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist (or was soft-deleted).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request was malformed or failed validation (e.g. unsupported image type or size).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    User:
      description: The local `identity.users` mirror (JIT-provisioned, no `role` field).
      type: object
      properties:
        id:
          type: string
          format: uuid
        oidc_sub:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, oidc_sub, email, is_active, created_at, updated_at]
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 320
      required: [email]
    CreateUserResponse:
      type: object
      properties:
        sub:
          type: string
      required: [sub]
    Product:
      description: A merchant's product listing.
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
        price:
          type: string
          description: Decimal (money) serialized as a string.
        image_key:
          type: [string, "null"]
          description: Processed public object key; set by the image worker only after the upload passes.
        image_status:
          type: string
          enum: [none, pending, ready, failed]
          description: Image pipeline state (worker-owned; never accepted from input).
        image_url:
          type: [string, "null"]
          description: Unsigned CDN URL for a `ready` image, else `null`.
        image_thumbnail_urls:
          type: [object, "null"]
          additionalProperties:
            type: string
          description: >-
            Unsigned CDN URLs for the generated thumbnails of a `ready` image, keyed by
            rendition name (`thumb_256`, `thumb_64`); `null` when there is no ready image.
        available:
          type: [integer, "null"]
          minimum: 0
          description: >-
            Purchasable units (`on_hand − reserved` from inventory), attached fresh on
            every response (never cached). `null` = unknown (no stock row), never
            zero; `0` = known out of stock.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 0
          description: >-
            The product's optimistic-lock counter — the value the `ETag`
            response header carries (quoted). Echo it back as `If-Match` on
            PATCH/DELETE to reject stale writes with 412 (ADR 0018).
      required: [id, merchant_id, name, description, category, price, image_key, image_status, image_url, image_thumbnail_urls, available, version, created_at, updated_at]
    ProductCreate:
      description: Merchant create payload. `merchant_id` is bound from the caller, never from input. `image_key`/`image_status` are worker-owned and not accepted here.
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
          maxLength: 255
        price:
          type: string
          description: Positive decimal money value (> 0).
      required: [name, price]
    ProductUpdate:
      description: Partial merchant update — every field optional; unset fields are untouched. `image_key` is not updatable here (use the presign endpoint). An empty body is rejected (422) — it would emit a `ProductUpdated` event for a change that never happened. `name`/`price` back NOT-NULL columns, so they may be omitted but never sent as `null`.
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]
        category:
          type: [string, "null"]
          maxLength: 255
        price:
          type: string
          description: Positive decimal money value (> 0).
    ImagePresignRequest:
      description: Merchant declares the intended upload; validated BEFORE a URL is issued.
      type: object
      additionalProperties: false
      properties:
        content_type:
          type: string
          description: Claimed image MIME type (image/jpeg, image/png, image/webp).
        content_length:
          type: integer
          minimum: 1
          description: >-
            Declared byte size. Rejected above the server cap, and the presigned-POST
            `content-length-range` policy is pinned to it — an upload larger than what
            you declared is rejected by S3.
      required: [content_type, content_length]
    ImagePresignResponse:
      description: >-
        Presigned-POST envelope for a direct-to-S3 upload. `fields` already carry
        the content-type + `content-length-range` policy conditions, so an upload
        violating them is rejected by S3 itself.
      type: object
      properties:
        url:
          type: string
          description: S3 POST endpoint the client uploads to.
        fields:
          type: object
          additionalProperties:
            type: string
          description: Form fields (policy, signature, key, content-type) to POST alongside the file.
        key:
          type: string
          description: The private upload object key the file lands at.
        expires_in:
          type: integer
          description: Seconds until the presigned POST expires.
      required: [url, fields, key, expires_in]
    ProductPage:
      description: One keyset page of products.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; `null` on the last page.
      # next_cursor is always present (explicitly null on the last page), so it is
      # required — clients must not have to distinguish "absent" from "null".
      required: [items, next_cursor]
    CartItem:
      description: One cart line — a product snapshot plus the chosen quantity.
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        name:
          type: string
          description: Snapshot, refreshed automatically on product edits.
        unit_price:
          type: string
          description: Decimal (money) serialized as a string.
        image_url:
          type: [string, "null"]
        quantity:
          type: integer
          minimum: 1
      required: [product_id, name, unit_price, image_url, quantity]
    Cart:
      description: "The caller's basket. Empty cart is `{items: [], ...}`, never 404."
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        updated_at:
          type: string
          format: date-time
      required: [items, updated_at]
    CartAddItem:
      description: Add-to-cart payload — the line is created or incremented (clamped to the cap).
      type: object
      additionalProperties: false
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          description: Out-of-range quantities answer 400 (server caps, not schema).
      required: [product_id, quantity]
    CartUpdateItem:
      description: Set-quantity payload — `0` removes the line.
      type: object
      additionalProperties: false
      properties:
        quantity:
          type: integer
          description: Out-of-range quantities answer 400 (server caps, not schema).
      required: [quantity]
    StockUpsertRequest:
      description: The body of `PUT /v1/admin/inventory/{sku}` — the SKU's new `on_hand`.
      type: object
      additionalProperties: false
      properties:
        on_hand:
          type: integer
          minimum: 0
          maximum: 1000000000
          description: >-
            The total units physically on hand (`reserved` is tracked separately and
            never accepted here). `0` = known out of stock.
      required: [on_hand]
    Inventory:
      description: A stock row — `on_hand` minus `reserved` is what shoppers can buy.
      type: object
      properties:
        sku:
          type: string
          maxLength: 64
        on_hand:
          type: integer
          minimum: 0
          description: Total units physically on hand.
        reserved:
          type: integer
          minimum: 0
          description: Units currently held by live checkout reservations.
        version:
          type: integer
          description: >-
            Manual optimistic-lock version, bumped on every stock write that
            changes `on_hand` or `reserved` (a same-value re-PUT is a no-op).
      required: [sku, on_hand, reserved, version]
    CheckoutRequest:
      description: >-
        Checkout body — the cart is server-side, so only the gateway token
        travels: a hosted-checkout token/ref, never card data (a PAN-shaped
        value is rejected with 400 at the payments boundary).
      type: object
      additionalProperties: false
      properties:
        payment_token:
          type: string
          minLength: 1
          maxLength: 512
      required: [payment_token]
    OrderItem:
      description: One order line — catalog facts (name, price) frozen at checkout time; later catalog edits never rewrite order history.
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        product_name:
          type: string
        unit_price:
          type: string
          description: Decimal (money) serialized as a string.
        quantity:
          type: integer
          minimum: 1
      required: [id, product_id, product_name, unit_price, quantity]
    Order:
      description: >-
        An order and its lines — the record of one checkout. `pending` arises
        only from crash recovery (the stub gateway settles synchronously);
        terminal states are `paid`/`shipped`/`cancelled`.
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
        total:
          type: string
          description: Decimal (money) serialized as a string.
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, user_id, status, total, items, created_at, updated_at]
    OrderPage:
      description: One keyset page of the caller's orders.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; `null` on the last page.
      required: [items, next_cursor]
    AdminUser:
      description: One Keycloak directory entry, resolved live from the Admin API — not the local mirror; `sub` is the Keycloak id.
      type: object
      properties:
        sub:
          type: string
          description: The Keycloak user id (the OIDC `sub`).
        email:
          type: [string, "null"]
          description: May be `null` — an account without an address.
        merchant_role:
          type: boolean
        disabled:
          type: boolean
      required: [sub, email, merchant_role, disabled]
    AdminUserPage:
      description: One keyset page of the admin directory.
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        next_cursor:
          type: [string, "null"]
          description: Opaque cursor for the next page; `null` on the last page.
      required: [items, next_cursor]
    Problem:
      description: RFC 9457 Problem Details (the one flat error shape).
      type: object
      properties:
        type:
          type: string
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        trace_id:
          type: string
        details:
          type: array
          items:
            type: object
      required: [type, status, title]
