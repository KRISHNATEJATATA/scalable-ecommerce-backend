openapi: 3.1.0
info:
  title: Scalable E-commerce Backend API
  version: 0.1.0
  description: >-
    Async, API-first FastAPI e-commerce backend. Hand-authored contract and
    design source of truth (Spectral-linted). Paths are filled in per phase.
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: health
    description: Liveness and readiness probes
  - name: metrics
    description: Prometheus metrics exposition
paths:
  /v1/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      description: Returns 200 while the process is alive. Performs no dependency checks.
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                required: [status]
  /v1/ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe
      description: Pings Postgres and Valkey; 200 when both are reachable, 503 otherwise.
      responses:
        "200":
          description: All critical dependencies are reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checks:
                    type: object
                    additionalProperties:
                      type: boolean
                required: [status, checks]
        "503":
          description: One or more critical dependencies are unreachable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /metrics:
    get:
      tags: [metrics]
      operationId: getMetrics
      summary: Prometheus metrics
      description: Prometheus text exposition of the default registry.
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    Problem:
      description: RFC 9457 Problem Details (the one flat error shape).
      type: object
      properties:
        type:
          type: string
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        trace_id:
          type: string
        details:
          type: array
          items:
            type: object
      required: [type, status, title]
