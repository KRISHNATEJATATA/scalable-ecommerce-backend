name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:          # Allows the workflow to be triggered manually.
  schedule:
    # Nightly loadtest: the p95 gate is too environment-sensitive to gate every
    # PR on a shared runner (see the loadtest job's runner-limitation note), so
    # it runs on a schedule and signals drift, not per-PR regressions.
    - cron: "0 3 * * *"

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Lint (Ruff + format + import boundaries)
        env:
          # `make lint` is the single source of truth (ruff check + ruff format
          # --check + lint-imports), so CI can't drift from pre-commit: it used to
          # run `ruff check` only, letting a badly formatted file or a cross-module
          # import — the boundary rule the modular monolith is built on — merge
          # green while the local hook rejected it. RUFF_OUTPUT_FORMAT keeps the
          # inline PR annotations the explicit flag used to give.
          RUFF_OUTPUT_FORMAT: github
        run: make lint

      # Advisory typecheck: basedpyright + ty both carry a known pre-existing
      # diagnostic baseline (AGENTS.md — "fix yours, don't chase the baseline"),
      # so a hard gate would red every PR for zero signal. continue-on-error
      # keeps the output visible on every run without blocking merges. Flip to a
      # hard gate once the baseline is burned down.
      - name: Typecheck (advisory)
        continue-on-error: true
        run: make typecheck

      # `python-magic` needs libmagic; without it the image-processing tests skip
      # and the no-skip gate below (deliberately empty allowlist) fails the build.
      # Install it before the tests rather than allowlisting a skip away.
      - name: Install libmagic
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      # The suite's Postgres/Valkey/LocalStack tests drive real containers via
      # Testcontainers; a runner without Docker would skip or fail them. Make the
      # dependency explicit so the crown-jewel coverage never degrades silently.
      - name: Verify Docker is available for Testcontainers
        run: docker info

      - name: Prepare test results directory
        run: mkdir -p test-results

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --junitxml=test-results/unit.xml

      # a skipped crown-jewel test is a loud failure, never silent
      # green. The gate's allowlist is empty on purpose; see scripts/ci_no_skips.py.
      - name: Fail on any skipped test
        run: python scripts/ci_no_skips.py test-results/unit.xml

  # Build-only: proves the Dockerfile still compiles on every PR. No registry
  # login, no push — publishing is a deploy concern, not CI.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t ecommerce-ci:${{ github.sha }} .

  # Nightly k6 load test: the full stack in compose, then checkout.js with its
  # p(95) < 300 ms threshold — k6 exits non-zero when a threshold fails, so the
  # gate is the script's own assertion, not a parsed report.
  #
  # RUNNER LIMITATION (documented, per ticket 02): GitHub-hosted runners are
  # shared VMs (2 cores) — absolute p95 numbers are noisy and a red run may be
  # the runner, not a regression. The honest long-term answer is a self-hosted
  # runner with pinned hardware; until then this job is a scheduled canary:
  # treat a *trend* of failures as the signal, not a single red run. The
  # multi-replica proof (loadtest/multi_replica.js) is correctness, not
  # latency — it tolerates runner noise and can be run here too by flipping
  # the script argument below.
  loadtest:
    # Scheduled nightly + manual; NOT per-PR (shared-runner latency noise
    # would gate merges on load the runner doesn't control).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # A wedged compose stack must not burn the 6-hour scheduled-runner window;
    # the concurrency group cancels a superseded run instead of stacking them.
    timeout-minutes: 30
    concurrency:
      group: loadtest-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start the full stack (2 app replicas)
        run: docker compose up -d --build --scale app=2

      - name: Seed the demo state
        run: docker compose run --rm catalog-seed

      - name: Wait for the API to answer
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/v1/health >/dev/null 2>&1; then
              echo "API is up"; exit 0
            fi
            sleep 2
          done
          echo "API did not come up in 60s"; docker compose logs app --tail 50; exit 1

      # k6 via its docker image: no k6 install step to drift. --network host so
      # the container reaches the compose-published ports on the runner host.
      - name: Run k6 checkout load test (p95 gate)
        run: |
          docker run --rm --network host \
            -v "$PWD/loadtest:/scripts" \
            -e BASE_URL=http://localhost:8000 \
            -e KEYCLOAK_URL=http://localhost:8080 \
            grafana/k6:0.54.0 run /scripts/checkout.js

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
