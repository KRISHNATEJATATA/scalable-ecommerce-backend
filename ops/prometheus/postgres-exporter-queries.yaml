# postgres_exporter custom queries — point at it with `--extend.query-path`.
#
# The reservation reaper's *liveness* signal cannot come from the reaper: a
# process that never starts increments and pushes nothing, so a flat counter
# can't be told apart from a healthy idle one. The backlog lives in Postgres,
# which is scraped whether or not the reaper is alive — that's why this query
# lives here rather than as an app metric.
#
# Alert rules on it: ops/prometheus/inventory-reaper-alerts.yaml. Runbook: docs/RUNBOOK.md §8.

inventory_reservations:
  # Served by the partial index `ix_reservations_expiry_sweep`
  # (expires_at WHERE status = 'held'), the reaper's own claim index — so this is cheap.
  query: >-
    SELECT count(*) AS expired_holds
    FROM inventory.reservations
    WHERE status = 'held' AND expires_at <= now()
  master: true
  metrics:
    - expired_holds:
        usage: "GAUGE"
        description: "Reservations past expires_at still held — the reaper's backlog. Healthy = near zero."

db_connections:
  # Server-wide connection pressure — the total every process's pool draws
  # against (budget formula in docs/DEPLOYMENT.md). Sourced from Postgres
  # itself so it keeps answering when every app process is down, same doctrine
  # as the reaper backlog above. This is the signal autoscaling's API-task
  # ceiling is judged against.
  # Alert rules on it: ops/prometheus/db-connection-budget-alerts.yaml. Runbook: docs/RUNBOOK.md §16.
  query: >-
    SELECT
      (SELECT count(*) FROM pg_stat_activity) AS connections_in_use,
      (SELECT setting::float8 FROM pg_settings WHERE name = 'max_connections') AS max_connections
  master: true
  metrics:
    - connections_in_use:
        usage: "GAUGE"
        description: "Open connections to this Postgres (all roles, all databases)."
    - max_connections:
        usage: "GAUGE"
        description: "The server's max_connections setting — the hard ceiling of the connection budget."

retention_backlog:
  # The retention prune's *liveness* signal, same doctrine as the reaper's: a
  # prune that never runs deletes nothing, so its counter stays silent — the
  # prunable-row backlog in Postgres keeps answering regardless. Row counts are
  # cheap seq scans here because a healthy prune empties them; keep the day
  # windows in sync with the OUTBOX_/RESERVATION_/SAGA_LOG_RETENTION_DAYS
  # defaults (docs/RUNBOOK.md §14). Alert: ops/prometheus/retention-prune-alerts.yaml.
  query: >-
    SELECT
      (SELECT count(*) FROM catalog.outbox WHERE published_at IS NOT NULL AND occurred_at < now() - interval '7 days')
      + (SELECT count(*) FROM inventory.outbox WHERE published_at IS NOT NULL AND occurred_at < now() - interval '7 days')
      + (SELECT count(*) FROM orders.outbox WHERE published_at IS NOT NULL AND occurred_at < now() - interval '7 days')
      + (SELECT count(*) FROM payments.outbox WHERE published_at IS NOT NULL AND occurred_at < now() - interval '7 days')
      + (SELECT count(*) FROM identity.outbox WHERE published_at IS NOT NULL AND occurred_at < now() - interval '7 days')
        AS prunable_outbox,
      (SELECT count(*) FROM inventory.reservations
        WHERE status IN ('released', 'committed') AND updated_at < now() - interval '90 days') AS prunable_reservations,
      (SELECT count(*) FROM orders.saga_log s JOIN orders.orders o ON o.id = s.order_id
        WHERE o.status <> 'pending' AND o.updated_at < now() - interval '90 days') AS prunable_saga_log
  master: true
  metrics:
    - prunable_outbox:
        usage: "GAUGE"
        description: "Published outbox rows past outbox_retention_days across all five module schemas."
    - prunable_reservations:
        usage: "GAUGE"
        description: "Terminal reservations past reservation_retention_days."
    - prunable_saga_log:
        usage: "GAUGE"
        description: "saga_log rows of terminal-status orders past saga_log_retention_days."
