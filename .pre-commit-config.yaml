repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: spectral-lint
        name: Spectral OpenAPI lint
        language: system
        entry: npm run validate
        pass_filenames: false
        files: ^api/openapi/.*\.yaml$
