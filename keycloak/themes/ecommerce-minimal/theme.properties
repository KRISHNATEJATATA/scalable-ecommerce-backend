# Minimal, unbranded email theme for the shared backend (realm default).
#
# The backend is used by multiple frontends, so its own email copy stays plain:
# subjects come from the message bundle below, bodies from the ftl files in
# email/html + email/text (email-verification.ftl, executeActions.ftl).
# A frontend brands the mail by pointing the realm's ``emailTheme`` at its own
# theme — decided at startup via the ``REALM_EMAIL_THEME`` placeholder in
# keycloak/realm-export.json (frontend compose overrides set that env var).
parent=keycloak
