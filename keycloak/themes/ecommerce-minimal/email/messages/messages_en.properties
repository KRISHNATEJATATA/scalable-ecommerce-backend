# Subjects for the backend's minimal email copy (the ftl files carry the bodies).
# Everything else falls back to the parent (keycloak) theme's bundle.
emailVerificationSubject=Activate your account
executeActionsSubject=Activate your account

# The LinkExpirationFormatterMethod bean (used by the ftl files) reads these from
# the theme's plain messages bundle — the base theme's copies don't arrive through
# the parent fallback, so they are carried here verbatim.
linkExpirationFormatter.timePeriodUnit.seconds={0,choice,0#seconds|1#second|1<seconds}
linkExpirationFormatter.timePeriodUnit.minutes={0,choice,0#minutes|1#minute|1<minutes}
linkExpirationFormatter.timePeriodUnit.hours={0,choice,0#hours|1#hour|1<hours}
linkExpirationFormatter.timePeriodUnit.days={0,choice,0#days|1#day|1<days}
